# 一键起全套：docker compose up -d
# 浏览器打开 http://localhost:3000
# 手机在同一局域网访问 http://<这台机器的IP>:3000

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # 容器里固定用挂载卷中的 SQLite（绝对路径）。
      # 刻意不复用 .env 里的 DATABASE_URL —— 那个是给"原生运行"准备的相对路径，
      # 两种语义混用会让人搞不清数据库到底落在哪。
      # 要换 Postgres，在 .env 里设 DOCKER_DATABASE_URL 覆盖这一项。
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite+aiosqlite:////app/data/trading_agent.db}
    volumes:
      # 用命名卷而不是 ./data 目录挂载。
      # 原因：Windows 上 Docker Desktop 把宿主目录挂进 Linux 容器要经过一层
      # 文件系统转换，SQLite 的文件锁在这层上容易出问题（database is locked
      # 甚至库损坏）。命名卷落在 WSL2 虚拟机的原生文件系统里，没有这个问题，
      # 读写也更快。代价是不能直接用资源管理器翻看 db 文件 ——
      # 需要时用 `docker compose cp backend:/app/data/trading_agent.db .` 取出来。
      - app-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 需要 PostgreSQL 时取消注释，并在 .env 里设：
  # DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/trading_agent
  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: trading_agent
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  app-data:
  # pgdata:
