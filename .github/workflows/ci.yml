name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # 验证"发布出去的产物"本身是完整的。
  # 曾经因为 .gitignore 的 `data/` 规则匹配了任意层级，backend/app/data/
  # 整个数据层没进版本库：本地工作区齐全、测试全绿，但打包出去就起不来。
  # 所以这一项刻意不在工作区跑，而是 git archive 到干净目录再跑。
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 导出发布产物
        run: |
          mkdir -p /tmp/artifact
          git archive HEAD | tar -x -C /tmp/artifact
      - name: 在产物中安装并运行测试
        working-directory: /tmp/artifact/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      # 只装运行时依赖（不带 dev），验证声明是否完整。
      # dev 额外会顺带拉进一堆包，把"漏声明但恰好被传递进来"的依赖盖住 ——
      # sqlalchemy 的 greenlet 就是这么漏的：2.0 按平台条件自动装，
      # 2.1 起不再装，于是线上直接 ImportError 而本地毫无征兆。
      - name: 仅装运行时依赖并导入
        run: |
          python -m venv /tmp/runtime-only
          /tmp/runtime-only/bin/pip install --upgrade pip
          /tmp/runtime-only/bin/pip install -e /tmp/artifact/backend
          cd /tmp/artifact/backend && /tmp/runtime-only/bin/python -c "from app.main import app"

      - name: 确认产物能真正启动
        working-directory: /tmp/artifact/backend
        env:
          LLM_PROVIDER: echo
          DATA_PROVIDER_ORDER: mock
          DATABASE_URL: sqlite+aiosqlite:////tmp/artifact-check.db
        run: |
          python -m uvicorn app.main:app --port 8765 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/v1/health && exit 0
            sleep 1
          done
          echo "产物启动失败：健康检查始终不通过" >&2
          exit 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 只装 dev 依赖：全部测试都跑在离线模式（mock 数据源 + echo 桩模型），
      # 不需要 akshare/tushare，也不需要任何 API Key
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不写 version：让它读 frontend/package.json 的 packageManager 字段，
      # 保证 CI、Docker、本地开发用的是同一个 pnpm 版本
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Build
        working-directory: frontend
        run: pnpm build
