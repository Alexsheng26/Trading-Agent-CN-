name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # 验证"发布出去的产物"本身是完整的。
  # 曾经因为 .gitignore 的 `data/` 规则匹配了任意层级，backend/app/data/
  # 整个数据层没进版本库：本地工作区齐全、测试全绿，但打包出去就起不来。
  # 所以这一项刻意不在工作区跑，而是 git archive 到干净目录再跑。
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 导出发布产物
        run: |
          mkdir -p /tmp/artifact
          git archive HEAD | tar -x -C /tmp/artifact
      - name: 在产物中安装并运行测试
        working-directory: /tmp/artifact/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      # 只装运行时依赖（不带 dev），验证声明是否完整。
      # dev 额外会顺带拉进一堆包，把"漏声明但恰好被传递进来"的依赖盖住 ——
      # sqlalchemy 的 greenlet 就是这么漏的：2.0 按平台条件自动装，
      # 2.1 起不再装，于是线上直接 ImportError 而本地毫无征兆。
      - name: 仅装运行时依赖并导入
        run: |
          python -m venv /tmp/runtime-only
          /tmp/runtime-only/bin/pip install --upgrade pip
          /tmp/runtime-only/bin/pip install -e /tmp/artifact/backend
          cd /tmp/artifact/backend && /tmp/runtime-only/bin/python -c "from app.main import app"

      - name: 确认产物能真正启动
        working-directory: /tmp/artifact/backend
        env:
          LLM_PROVIDER: echo
          DATA_PROVIDER_ORDER: mock
          DATABASE_URL: sqlite+aiosqlite:////tmp/artifact-check.db
        run: |
          python -m uvicorn app.main:app --port 8765 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/v1/health && exit 0
            sleep 1
          done
          echo "产物启动失败：健康检查始终不通过" >&2
          exit 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 只装 dev 依赖：全部测试都跑在离线模式（mock 数据源 + echo 桩模型），
      # 不需要 akshare/tushare，也不需要任何 API Key
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不写 version：让它读 frontend/package.json 的 packageManager 字段，
      # 保证 CI、Docker、本地开发用的是同一个 pnpm 版本
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Build
        working-directory: frontend
        run: pnpm build

  # Windows 原生一键脚本（scripts/windows）在真实 Windows + 系统自带的 Windows PowerShell 5.1
  # 上完整走一遍：双击入口 → 安装 → 启动 → 经前端访问后端 → 停止。
  # 开发环境是 Linux，这些脚本里调 Windows 自身的部分（taskkill、cmd、端口查询）只有这里能真跑。
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # 只验证脚本本身：不连行情网站、不用真模型（环境变量优先于 .env）
      DATA_PROVIDER_ORDER: mock
      SYMBOL_INDEX_AUTOREFRESH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # 和用户一样从 .cmd 进去：顺带验证 %~dp0、引号和 CRLF。< NUL 让末尾的 pause 直接过去
      - name: 安装（setup-windows.cmd）
        shell: cmd
        run: setup-windows.cmd < NUL
      - name: 确认安装完整
        shell: powershell
        run: |
          foreach ($f in 'backend\.venv\Scripts\python.exe', 'frontend\.next\BUILD_ID', '.env') {
            if (-not (Test-Path $f)) { throw "安装后缺少 $f" }
          }
      - name: 启动 → 经前端访问后端 → 再次启动 → 停止
        shell: powershell
        run: |
          $log = "$env:RUNNER_TEMP\start.log"
          $start = Start-Process powershell.exe -PassThru -RedirectStandardOutput $log -ArgumentList @(
            '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', "$PWD\scripts\windows\start.ps1", '-NoBrowser')
          try {
            $status = $null
            for ($i = 0; $i -lt 90 -and -not $start.HasExited; $i++) {
              try {
                $status = Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:3000/api/v1/status
                break
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $status) { throw '启动失败：前端 3000 端口一直访问不到' }
            if ($status.runtime -ne 'windows') { throw "runtime 应为 windows，实际是 $($status.runtime)" }

            # 已经在运行时再启动一次：应当直接返回，不动正在运行的实例
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\windows\start.ps1 -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "第二次启动退出码 $LASTEXITCODE" }
            if ($start.HasExited) { throw '第二次启动把正在运行的实例弄停了' }

            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\windows\stop.ps1
            Start-Sleep -Seconds 3
            foreach ($port in 3000, 8000) {
              if (Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue) {
                throw "停止后端口 $port 还在监听"
              }
            }
            if (-not $start.HasExited) { throw '停止后启动窗口还在' }
          } finally {
            Write-Host '----- start.ps1 输出 -----'
            if (Test-Path $log) { Get-Content $log }
          }
