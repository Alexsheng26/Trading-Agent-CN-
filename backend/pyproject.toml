[project]
name = "trading-agent-cn-backend"
version = "0.1.0"
description = "A股 AI 多智能体投研助手 —— 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # [asyncio] 不能省：它带上 greenlet，是 SQLAlchemy 异步支持的硬依赖。
    # SQLAlchemy 2.0 曾按平台条件自动装 greenlet，2.1 起不再这么做 ——
    # 于是"裸 sqlalchemy + 异步"在新版上直接 ImportError。
    # 依赖传递来的东西从来就没有保证，用到什么就显式声明什么。
    "sqlalchemy[asyncio]>=2.0.36",
    # SQLite 的异步驱动。不被代码直接 import，但 DATABASE_URL 用到它
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    # 新浪实时行情（app/data/sina_hq.py）直接用它发请求。anthropic 本身也依赖它，
    # 但按上面那条原则：用到什么就显式声明什么
    "httpx>=0.27",
]

[project.optional-dependencies]
# A股数据源：默认不强制安装，按需选择
akshare = ["akshare>=1.15", "pandas>=2.2"]
tushare = ["tushare>=1.4", "pandas>=2.2"]
# OpenAI 兼容模型接入（DeepSeek / 通义千问 / Kimi）
openai = ["openai>=1.54"]
# PostgreSQL
postgres = ["asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数是惯用写法

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
