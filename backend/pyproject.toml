[project]
name = "trading-agent-cn-backend"
version = "0.1.0"
description = "A股 AI 多智能体投研助手 —— 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# A股数据源：默认不强制安装，按需选择
akshare = ["akshare>=1.15", "pandas>=2.2"]
tushare = ["tushare>=1.4", "pandas>=2.2"]
# OpenAI 兼容模型接入（DeepSeek / 通义千问 / Kimi）
openai = ["openai>=1.54"]
# PostgreSQL
postgres = ["asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数是惯用写法

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
